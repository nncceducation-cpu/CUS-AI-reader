name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q app.py cus_ai tests
      - run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/browser_learning.test.mjs

